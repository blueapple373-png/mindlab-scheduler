<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Threads投稿管理 | MINAMI MINDLAB</title>
  <style>
    :root{--bg:#0f0f0f;--panel:#1b1b1b;--line:#333;--gold:#c9a96e;--text:#eee;--muted:#999;--ok:#66c98b;--warn:#e3b85b}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
    main{max-width:760px;margin:auto;padding:32px 18px 64px}h1{font-size:18px;color:var(--gold);letter-spacing:.08em}p{color:var(--muted);line-height:1.7}
    .login,.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;margin-top:18px}
    input,button{font:inherit;border-radius:7px;padding:11px 13px}input{width:100%;background:#111;border:1px solid var(--line);color:var(--text)}
    button{margin-top:10px;background:var(--gold);border:0;color:#111;font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
    .metric{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}.metric b{display:block;font-size:26px;margin-top:8px}.metric span{color:var(--muted);font-size:12px}
    .post{white-space:pre-wrap;line-height:1.75;border-top:1px solid var(--line);padding:16px 0}.meta{color:var(--gold);font-size:12px;margin-bottom:8px}.hidden{display:none}.safe{color:var(--ok)}.danger{color:var(--warn)}
    @media(max-width:560px){.grid{grid-template-columns:1fr}.metric b{font-size:22px}}
  </style>
</head>
<body><main>
  <h1>MINAMI MINDLAB — THREADS QUEUE</h1>
  <p>Google Sheetsで確認・承認した完成文だけを表示します。ここでは文章を生成しません。</p>
  <section class="login" id="login">
    <label for="secret">管理画面パスワード</label>
    <input id="secret" type="password" autocomplete="current-password">
    <button id="load">同期して表示</button>
    <p id="message"></p>
  </section>
  <section id="dashboard" class="hidden">
    <div class="grid">
      <div class="metric"><span>承認済み待機</span><b id="stock">–</b></div>
      <div class="metric"><span>残り日数</span><b id="days">–</b></div>
      <div class="metric"><span>トークン期限</span><b id="expiry" style="font-size:18px">–</b></div>
    </div>
    <div class="card"><b id="mode"></b><p>投稿本文と順番の変更はGoogle Sheetsで行います。</p></div>
    <div class="card"><h2 style="font-size:15px">次の投稿</h2><div id="posts"></div></div>
  </section>
  <script>
    const secretInput=document.getElementById('secret');
    secretInput.value=sessionStorage.getItem('mm_dashboard_secret')||'';
    document.getElementById('load').onclick=load;
    async function load(){
      const secret=secretInput.value.trim();
      const msg=document.getElementById('message');msg.textContent='同期中…';
      try{
        const res=await fetch('/api/status',{headers:{'x-dashboard-secret':secret}});
        const data=await res.json();if(!res.ok)throw new Error(data.error||'取得できませんでした');
        sessionStorage.setItem('mm_dashboard_secret',secret);msg.textContent='';
        document.getElementById('dashboard').classList.remove('hidden');
        document.getElementById('stock').textContent=data.stock+'件';
        document.getElementById('days').textContent=data.remainingDays+'日';
        document.getElementById('expiry').textContent=data.tokenExpiry||'未設定';
        const mode=document.getElementById('mode');mode.textContent=data.postingEnabled?'自動投稿：有効':'自動投稿：停止中';mode.className=data.postingEnabled?'safe':'danger';
        document.getElementById('posts').innerHTML=data.nextPosts.length?data.nextPosts.map((p,i)=>`<div class="post"><div class="meta">${i+1}. ${esc(p.queueId)} / ${esc(p.materialId)}</div>${esc(p.text)}</div>`).join(''):'<p>承認済みの待機投稿はありません。</p>';
      }catch(e){msg.textContent='エラー：'+e.message;document.getElementById('dashboard').classList.add('hidden')}
    }
    function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  </script>
</main></body></html>
